name: business-bot

services:
  # ── Database ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: bb_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-storeuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-storepass}
      POSTGRES_DB: ${DB_NAME:-storedb}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-storeuser} -d ${DB_NAME:-storedb}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── API server (Owner console backend) ────────────────────────────────────
  store-backend:
    image: ${DOCKERHUB_USER}/store-backend:latest
    container_name: bb_backend
    command: ["server"]
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-storeuser}
      DB_PASSWORD: ${DB_PASSWORD:-storepass}
      DB_NAME: ${DB_NAME:-storedb}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OWNER_NAME: ${OWNER_NAME:-Owner}
      OWNER_EMAIL: ${OWNER_EMAIL:-owner@business.local}
      PORT: "8080"
      PICOCLAW_LOG_PATH: /shared/picoclaw.log
      ANTHROPIC_KEY_FILE: /shared/anthropic_key
      LLM_KEYS_FILE: /shared/llm_keys.json
      LIVEKEEPING_FILE: /shared/livekeeping.json
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-store-internal}
      OWNER_PASSWORD: ${OWNER_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-}
      PICOCLAW_URL: http://picoclaw:18790
      # Bot conversation store (shared from picoclaw) for the idle-chat cleanup job.
      SESSIONS_DIR: /picoclaw-data/workspace/sessions
      SESSION_IDLE_HOURS: ${SESSION_IDLE_HOURS:-24}
    volumes:
      - bot_state:/shared
      # Shared with picoclaw so the "Reset idle chats" job can prune old sessions.
      - picoclaw_data:/picoclaw-data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── MCP server (directory exposed to the bot) ─────────────────────────────
  store-mcp:
    image: ${DOCKERHUB_USER}/store-backend:latest
    container_name: bb_mcp
    command: ["mcp"]
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-storeuser}
      DB_PASSWORD: ${DB_PASSWORD:-storepass}
      DB_NAME: ${DB_NAME:-storedb}
      MCP_PORT: "9090"
    depends_on:
      postgres:
        condition: service_healthy
      store-backend:
        condition: service_started
    restart: unless-stopped

  # ── Owner console (web UI) ────────────────────────────────────────────────
  store-frontend:
    image: ${DOCKERHUB_USER}/store-frontend:latest
    container_name: bb_frontend
    depends_on:
      - store-backend
    restart: unless-stopped

  # ── WhatsApp agent (PicoClaw) ──────────────────────────────────────────────
  picoclaw:
    image: ${DOCKERHUB_USER}/store-picoclaw:latest
    container_name: bb_picoclaw
    entrypoint: ["/bin/sh", "/init/picoclaw-init.sh"]
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      TZ: ${TZ:-UTC}
      CONTACT_INGEST_URL: http://store-backend:8080/internal/bot/contact-seen
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-store-internal}
    volumes:
      - ./picoclaw-config:/init:ro
      - picoclaw_data:/root/.picoclaw
      - bot_state:/shared
    depends_on:
      - store-mcp
    restart: unless-stopped

  # ── Reverse proxy: the only service exposed to the internet ───────────────
  caddy:
    image: caddy:2-alpine
    container_name: bb_caddy
    environment:
      # Set SITE_ADDRESS to your domain (e.g. store.example.com) to turn on
      # automatic HTTPS; unset it falls back to plain HTTP on :80.
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - store-backend
      - store-frontend
    restart: unless-stopped

volumes:
  pgdata:
  picoclaw_data:
  bot_state:
  caddy_data:
