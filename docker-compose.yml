name: business-bot

services:
  # ── API server (Owner console backend) ────────────────────────────────────
  # The database is external (Neon) — set DATABASE_URL in .env. There is no
  # bundled Postgres service; see README for running one for the test suite.
  store-backend:
    build: ./backend
    container_name: bb_backend
    command: ["server"]
    environment:
      # Required: the managed Postgres (Neon) connection string.
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env — this stack has no bundled Postgres}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Console admin, seeded on first boot. ADMIN_PASSWORD is required — the
      # server refuses to start without it.
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      PORT: "8080"
      PICOCLAW_LOG_PATH: /shared/picoclaw.log
      ANTHROPIC_KEY_FILE: /shared/anthropic_key
      LLM_KEYS_FILE: /shared/llm_keys.json
      LIVEKEEPING_FILE: /shared/livekeeping.json
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-store-internal}
      # Optional: generated and persisted to /shared/jwt_secret when blank.
      JWT_SECRET: ${JWT_SECRET:-}
      # Owner-console assistant proxies chat to PicoClaw's console channel.
      PICOCLAW_URL: http://picoclaw:18790
      # Bot conversation store (shared from picoclaw) for the idle-chat cleanup job.
      SESSIONS_DIR: /picoclaw-data/workspace/sessions
      SESSION_IDLE_HOURS: ${SESSION_IDLE_HOURS:-24}
    # Lets the backend reach a local LLM (Ollama/LM Studio) on the host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - bot_state:/shared
      # Shared with picoclaw so the "Reset idle chats" job can prune old sessions.
      - picoclaw_data:/picoclaw-data
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── MCP server (directory exposed to the bot) ─────────────────────────────
  store-mcp:
    build: ./backend
    container_name: bb_mcp
    command: ["mcp"]
    environment:
      # Must point at the SAME database as store-backend.
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env — this stack has no bundled Postgres}
      MCP_PORT: "9090"
    depends_on:
      # Waits for the API so the MCP server doesn't race its AutoMigrate.
      store-backend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:9090/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # ── Owner console (web UI) ────────────────────────────────────────────────
  store-frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8080}
    container_name: bb_frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - store-backend
    restart: unless-stopped

  # ── WhatsApp agent (PicoClaw) ─────────────────────────────────────────────
  picoclaw:
    build:
      context: ./picoclaw
      # Build with the `whatsapp_native` tag so the QR-pairing WhatsApp channel
      # is compiled in (the stock Dockerfile omits it, leaving only the
      # bridge-based channel). Otherwise mirrors picoclaw/docker/Dockerfile.
      dockerfile_inline: |
        FROM golang:1.25-alpine AS builder
        RUN apk add --no-cache git make
        WORKDIR /src
        COPY go.mod go.sum ./
        RUN go mod download
        COPY . .
        # Emit the raw QR string and login events on their own log lines so our
        # backend can surface WhatsApp pairing status + a crisp QR in the console.
        RUN sed -i 's#logger.InfoCF("whatsapp", "Scan this QR code with WhatsApp (Linked Devices):", nil)#logger.InfoCF("whatsapp", "Scan this QR code with WhatsApp (Linked Devices):", nil); logger.InfoCF("whatsapp", "WHATSAPP_QR_CODE="+evt.Code, nil)#' pkg/channels/whatsapp_native/whatsapp_native.go && \
            sed -i 's#logger.InfoCF("whatsapp", "WhatsApp login event", map\[string\]any{"event": evt.Event})#logger.InfoCF("whatsapp", "WHATSAPP_LOGIN_EVENT="+evt.Event, nil)#' pkg/channels/whatsapp_native/whatsapp_native.go && \
            sed -i 's#case \*events\.Disconnected:#case *events.LoggedOut: logger.InfoCF("whatsapp", "WHATSAPP_LOGGED_OUT", nil); return; case *events.Disconnected:#' pkg/channels/whatsapp_native/whatsapp_native.go && \
            sed -i 's#switch v := evt.(type) {#switch v := evt.(type) {\n\tcase *events.Connected:\n\t\tif c.client != nil \&\& c.client.Store.ID != nil { logger.InfoCF("whatsapp", "WHATSAPP_OWN_NUMBER="+c.client.Store.ID.User, nil) }#' pkg/channels/whatsapp_native/whatsapp_native.go
        # Make billing/quota errors (e.g. Anthropic's HTTP-400 "credit balance too
        # low") trigger provider failover. By default a 400 is classified as a
        # non-retriable "format" error before the billing message is ever checked,
        # so the fallback provider would never kick in for credit exhaustion.
        RUN sed -i 's#\t// Try HTTP status code extraction first.#\tif r := classifyByMessage(msg); r == FailoverBilling || r == FailoverRateLimit { return \&FailoverError{Reason: r, Provider: provider, Model: model, Wrapped: err} }\n\t// Try HTTP status code extraction first.#' pkg/providers/error_classifier.go
        RUN make build GO_BUILD_TAGS=goolm,stdjson,whatsapp_native
        FROM alpine:3.23
        RUN apk add --no-cache ca-certificates tzdata curl jq
        COPY --from=builder /src/build/picoclaw /usr/local/bin/picoclaw
    container_name: bb_picoclaw
    entrypoint: ["/bin/sh", "/init/picoclaw-init.sh"]
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      TZ: ${TZ:-UTC}
      CONTACT_INGEST_URL: http://store-backend:8080/internal/bot/contact-seen
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-store-internal}
    # Lets the bot reach a local LLM (Ollama/LM Studio) on the host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./picoclaw-config:/init:ro
      - picoclaw_data:/root/.picoclaw
      - bot_state:/shared
    ports:
      - "${PICOCLAW_PORT:-18790}:18790"
    depends_on:
      # Must be HEALTHY, not merely started: PicoClaw connects to the MCP server
      # once at boot and never retries, so losing this race leaves the bot with
      # no catalog tools until it is restarted.
      store-mcp:
        condition: service_healthy
    restart: unless-stopped

volumes:
  picoclaw_data:
  bot_state:
